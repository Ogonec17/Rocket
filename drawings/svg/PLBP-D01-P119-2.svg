<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297"><rect width="420" height="297" fill="white"/><rect x="5" y="5" width="410" height="287" fill="none" stroke="#171c20" stroke-width=".3"/><path d="M5.0000,30.0000 L415.0000,30.0000" fill="none" stroke="#171c20" stroke-width="0.25"/><path d="M5.0000,243.0000 L415.0000,243.0000" fill="none" stroke="#171c20" stroke-width="0.25"/><text x="12" y="14" font-family="DejaVu Sans" font-size="5" text-anchor="start" fill="#171c20" font-weight="bold">PLBP-D01-P119</text><text x="408" y="14" font-family="DejaVu Sans" font-size="3" text-anchor="end" fill="#171c20">D01 / DW01 · 01.10.2026</text><text x="12" y="22.0" font-family="DejaVu Sans" font-size="3.6" text-anchor="start" fill="#171c20">Макет · оболочка Ø84, общий размер 220 мм · координаты цилиндрических поверхностей</text><text x="12" y="250" font-family="DejaVu Sans" font-size="3.2" text-anchor="start" fill="#171c20" font-weight="bold">ПРОЕКТНЫЙ ЧЕРТЁЖ · НОМИНАЛЬНАЯ ГЕОМЕТРИЯ · НЕ ВЫПУЩЕНО В ПРОИЗВОДСТВО</text><text x="12" y="286" font-family="DejaVu Sans" font-size="3" text-anchor="start" fill="#171c20">PLBP-SG1 · Супер ГИРД | A3: 420 × 297 мм | Размеры: мм | Печатать 100%</text><text x="408" y="286" font-family="DejaVu Sans" font-size="3" text-anchor="end" fill="#171c20">Лист 2/2</text><text x="13" y="41" font-family="DejaVu Sans" font-size="3" text-anchor="start" fill="#171c20">Точки осей и направления заданы в локальной системе первого листа. Ø не является назначением посадки.</text><text x="13" y="49" font-family="DejaVu Sans" font-size="3" text-anchor="start" fill="#171c20">Наружная / внутренняя поверхность — классификация геометрии; внутренняя не всегда сквозное отверстие.</text><text x="13" y="60" font-family="DejaVu Sans" font-size="3.1" text-anchor="start" fill="#171c20" font-weight="bold">ID    Тип       Ø, мм        Точка на оси X / Y / Z, мм                         Направление оси i / j / k</text><text x="13" y="69.0" font-family="DejaVu Sans" font-size="2.8" text-anchor="start" fill="#171c20">C01</text><text x="27" y="69.0" font-family="DejaVu Sans" font-size="2.8" text-anchor="start" fill="#171c20">наруж.</text><text x="49" y="69.0" font-family="DejaVu Sans" font-size="2.8" text-anchor="start" fill="#171c20">84</text><text x="77" y="69.0" font-family="DejaVu Sans" font-size="2.8" text-anchor="start" fill="#171c20">108 / 42 / 42</text><text x="239" y="69.0" font-family="DejaVu Sans" font-size="2.8" text-anchor="start" fill="#171c20">1 / 0 / -0</text><text x="13" y="75.4" font-family="DejaVu Sans" font-size="2.8" text-anchor="start" fill="#171c20">C02</text><text x="27" y="75.4" font-family="DejaVu Sans" font-size="2.8" text-anchor="start" fill="#171c20">внутр.</text><text x="49" y="75.4" font-family="DejaVu Sans" font-size="2.8" text-anchor="start" fill="#171c20">80</text><text x="77" y="75.4" font-family="DejaVu Sans" font-size="2.8" text-anchor="start" fill="#171c20">108 / 42 / 42</text><text x="239" y="75.4" font-family="DejaVu Sans" font-size="2.8" text-anchor="start" fill="#171c20">1 / 0 / -0</text><text x="12" y="257.0" font-family="DejaVu Sans" font-size="3" text-anchor="start" fill="#171c20">Точка на оси — проекция центра цилиндрической поверхности на её ось; любая точка L(t)=P+t·a задаёт ту же ось. Для изготовления требуются утверждённые допуски и ограничение поверхности по 3D-модели.</text><text x="12" y="278" font-family="DejaVu Sans" font-size="3" text-anchor="start" fill="#171c20">Координатная таблица дополняет виды; глубины глухих отверстий не следует выводить из бесконечной оси.</text></svg>