ры получены проекцией BRep. Перед изготовлением: выпуск</text><text x="295" y="76.94" font-family="DejaVu Sans" font-size="2.8" text-anchor="start" fill="#171c20">допусков, технологии и проверка креплений.</text><text x="15" y="224" font-family="DejaVu Sans" font-size="3.2" text-anchor="start" fill="#171c20">Локальный габарит X × Y × Z: 240 × 4 × 8 мм</text><text x="15" y="233.0" font-family="DejaVu Sans" font-size="2.7" text-anchor="start" fill="#171c20">Ориентация листа: Rx 0°; затем перенос начала в (825; -44; -4) мм повернутой сборки.</text><text x="12" y="258.0" font-family="DejaVu Sans" font-size="3" text-anchor="start" fill="#171c20">Материал / массовая модель: GFRP assumed rho1.85</text><text x="12" y="271" font-family="DejaVu Sans" font-size="3" text-anchor="start" fill="#171c20">Позиция 001 · Кол. 1 · Масса 14.208 г · Тел 1 · Размеры со * — справочные</text><text x="250" y="279" font-family="DejaVu Sans" font-size="2.8" text-anchor="start" fill="#171c20">Утвердил: —  |  Технология: —  |  Допуски: —</text></svg>