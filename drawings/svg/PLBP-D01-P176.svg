nt-size="3.2" text-anchor="start" fill="#171c20">Проектная деталь · материал и допуски уточнить</text><text x="295" y="50.64" font-family="DejaVu Sans" font-size="2.8" text-anchor="start" fill="#171c20">1. Размеры номинальные из CAD D01. Общие допуски, шероховатость и</text><text x="295" y="54.7" font-family="DejaVu Sans" font-size="2.8" text-anchor="start" fill="#171c20">посадки не назначены.</text><text x="295" y="61.76" font-family="DejaVu Sans" font-size="2.8" text-anchor="start" fill="#171c20">2. Масса расчётная; плотность либо назначенная масса взяты из</text><text x="295" y="65.82" font-family="DejaVu Sans" font-size="2.8" text-anchor="start" fill="#171c20">ведомости.</text><text x="295" y="72.88" font-family="DejaVu Sans" font-size="2.8" text-anchor="start" fill="#171c20">3. Контуры получены проекцией BRep. Перед изготовлением: выпуск</text><text x="295" y="76.94" font-family="DejaVu Sans" font-size="2.8" text-anchor="start" fill="#171c20">допусков, технологии и проверка креплений.</text><text x="295" y="84.0" font-family="DejaVu Sans" font-size="2.8" text-anchor="start" fill="#171c20">4. Перо: корень 200; конец 90; стреловидность 70; вынос 110; толщина</text><text x="295" y="88.06" font-family="DejaVu Sans" font-size="2.8" text-anchor="start" fill="#171c20">3.</text><text x="295" y="95.12" font-family="DejaVu Sans" font-size="2.8" text-anchor="start" fill="#171c20">5. Корневая часть X1340–1520, радиус от оси 29,2–50; соединение с</text><text x="295" y="99.18" font-family="DejaVu Sans" font-size="2.8" text-anchor="start" fill="#171c20">трубой не выпущено.</text><text x="15" y="224" font-family="DejaVu Sans" font-size="3.2" text-anchor="start" fill="#171c20">Локальный габарит X × Y × Z: 200 × 130.8 × 3 мм</text><text x="15" y="233.0" font-family="DejaVu Sans" font-size="2.7" text-anchor="start" fill="#171c20">Ориентация листа: Rx -120°; затем перенос начала в (1330; 29.2; -1.5) мм повернутой сборки.</text><text x="12" y="258.0" font-family="DejaVu Sans" font-size="3" text-anchor="start" fill="#171c20">Материал / массовая модель: GFRP assumed rho1.85</text><text x="12" y="271" font-family="DejaVu Sans" font-size="3" text-anchor="start" fill="#171c20">Позиция 176 · Кол. 1 · Масса 109.302 г · Тел 1 · Размеры со * — справочные</text><text x="250" y="279" font-family="DejaVu Sans" font-size="2.8" text-anchor="start" fill="#171c20">Утвердил: —  |  Технология: —  |  Допуски: —</text></svg>