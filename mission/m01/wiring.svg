<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650"><rect width="1200" height="650" fill="#101719"/><style>text{font-family:DejaVu Sans,sans-serif;fill:#f4f1e9;font-size:20px}.small{font-size:17px;fill:#afbdc0}</style><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#ff793f"/></marker></defs><text x="40" y="48" style="font-size:30px">M01 / питание и интерфейсы стендового прототипа</text><rect x="40" y="160" width="270" height="140" rx="8" fill="#1a2427" stroke="#ff793f"/><text x="58" y="192">BT1 / LiPo 1S + PCM</text><text x="58" y="221">1200 мА·ч номинал</text><text x="58" y="250">JST → BAT U1</text><rect x="430" y="130" width="340" height="240" rx="8" fill="#1a2427" stroke="#ff793f"/><text x="448" y="162">U1 / Feather RP2040</text><text x="448" y="191">3V3 → локальное питание</text><text x="448" y="220">D5 → ключ Q1</text><text x="448" y="249">D9 → 470 Ом → LED</text><text x="448" y="278">D6 / D12 → INHIBIT / TEST</text><text x="448" y="307">EN → выключатель GND</text><rect x="880" y="160" width="280" height="160" rx="8" fill="#1a2427" stroke="#ff793f"/><text x="898" y="192">BZ1 / активный 3 В</text><text x="898" y="221">3V3 → BZ1 → Q1 → GND</text><text x="898" y="250">Диод параллельно BZ1</text><text x="898" y="279">100 Ом G; 100 кОм G–S</text><line x1="310" y1="230" x2="430" y2="230" stroke="#ff793f" stroke-width="2" marker-end="url(#arrow)"/><text class="small" x="318" y="218">BAT / GND</text><line x1="770" y1="230" x2="880" y2="230" stroke="#ff793f" stroke-width="2" marker-end="url(#arrow)"/><text class="small" x="778" y="218">D5 / 3V3</text><text class="small" x="40" y="510">Локальная GND соединяет только компоненты M01. Основной борт электрически не подключён.</text><text class="small" x="40" y="539">USB отсоединён в полётной конфигурации. EN отключает стабилизатор, но не все цепи батареи.</text><text class="small" x="40" y="568">Полная таблица цепей: wiring.csv. Это структурная схема, не разводка печатной платы.</text><text class="small" x="40" y="597">Перед монтажом сверить полярность батареи, выводы Q1 и реальные посадочные места.</text></svg>