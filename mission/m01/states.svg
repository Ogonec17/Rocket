<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650"><rect width="1200" height="650" fill="#101719"/><style>text{font-family:DejaVu Sans,sans-serif;fill:#f4f1e9;font-size:20px}.small{font-size:17px;fill:#afbdc0}</style><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#ff793f"/></marker></defs><text x="40" y="48" style="font-size:30px">M01 / алгоритм независимого таймера</text><rect x="40" y="180" width="300" height="150" rx="8" fill="#1a2427" stroke="#ff793f"/><text x="58" y="212">SAFE</text><text x="58" y="241">INHIBIT замкнут</text><text x="58" y="270">TEST ≤2 с за нажатие</text><rect x="450" y="180" width="300" height="150" rx="8" fill="#1a2427" stroke="#ff793f"/><text x="468" y="212">DELAY</text><text x="468" y="241">300 с после взведения</text><text x="468" y="270">Питание уже расходуется</text><rect x="860" y="180" width="300" height="150" rx="8" fill="#1a2427" stroke="#ff793f"/><text x="878" y="212">SEARCH</text><text x="878" y="241">2 × 0,2 с / 2 с</text><text x="878" y="270">Звук 20%; LED 30%</text><line x1="340" y1="250" x2="450" y2="250" stroke="#ff793f" stroke-width="2" marker-end="url(#arrow)"/><text class="small" x="348" y="238">Открыт 2 с</text><line x1="750" y1="250" x2="860" y2="250" stroke="#ff793f" stroke-width="2" marker-end="url(#arrow)"/><text class="small" x="758" y="238">300 с</text><text class="small" x="40" y="510">INHIBIT замкнут 2 с → SAFE из любого рабочего состояния.</text><text class="small" x="40" y="539">Загрузка при открытой петле → SEARCH сразу; повреждение записи не перезапускает задержку.</text><text class="small" x="40" y="568">Посадка не определяется. Долгое ожидание на старте может включить звук до полёта.</text><text class="small" x="40" y="597">17 проверок программного ядра; адаптер и watchdog на плате ещё не проверены.</text></svg>