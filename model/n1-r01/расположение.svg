<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850"><rect width="100%" height="100%" fill="#f7f8f5"/><g font-family="DejaVu Sans, sans-serif" fill="#233b47"><text x="65" y="60" font-size="30">Н1 / РАСПОЛОЖЕНИЕ КОМПОНЕНТОВ</text><text x="65" y="90" font-size="15">Миллиметры · ось Z от хвостового торца · проектная компоновка R01</text><path d="M 120.0 210 Q 141.0 170 298.5 170 L 1222.5 170 L 1222.5 250 L 298.5 250 Q 141.0 250 120.0 210 Z" fill="#e1e6e4" stroke="#345665" stroke-width="2"/><rect x="345.75" y="180" width="231.0" height="60" rx="3" fill="#d5a357"/><path d="M 461.25 250 V 285" stroke="#526b73"/><text x="461.25" y="310" text-anchor="middle" font-size="14">МГМ · Ø66 × 220</text><rect x="613.5" y="180" width="120.75" height="60" rx="3" fill="#e7be83"/><path d="M 673.875 250 V 285" stroke="#526b73"/><text x="673.875" y="310" text-anchor="middle" font-size="14">Укладка спасения</text><rect x="767.85" y="180" width="212.10000000000002" height="60" rx="3" fill="#699d93"/><path d="M 873.9 250 V 285" stroke="#526b73"/><text x="873.9" y="310" text-anchor="middle" font-size="14">Электроника</text><rect x="1046.1" y="180" width="168.0" height="60" rx="3" fill="#8c9da7"/><path d="M 1130.1 250 V 285" stroke="#526b73"/><text x="1130.1" y="310" text-anchor="middle" font-size="14">Двигатель · габарит</text><path d="M 120.0 130 H 1222.5 M 120.0 123 V 137 M 1222.5 123 V 137" stroke="#526b73"/><text x="671.25" y="120" text-anchor="middle" font-size="17">1050</text><path d="M 1222.5 335 V 348" stroke="#526b73"/><text x="1222.5" y="371" text-anchor="middle" font-size="14">Z 0</text><path d="M 1012.5 335 V 348" stroke="#526b73"/><text x="1012.5" y="371" text-anchor="middle" font-size="14">Z 200</text><path d="M 750.0 335 V 348" stroke="#526b73"/><text x="750.0" y="371" text-anchor="middle" font-size="14">Z 450</text><path d="M 592.5 335 V 348" stroke="#526b73"/><text x="592.5" y="371" text-anchor="middle" font-size="14">Z 600</text><path d="M 298.5 335 V 348" stroke="#526b73"/><text x="298.5" y="371" text-anchor="middle" font-size="14">Z 880</text><path d="M 120.0 335 V 348" stroke="#526b73"/><text x="120.0" y="371" text-anchor="middle" font-size="14">Z 1050</text><text x="65" y="425" font-size="22">ИЗМЕРЕНИЯ И СОБЫТИЯ</text><text x="65" y="465" font-size="15" font-weight="bold">Барометр / инерциальный модуль</text><text x="65" y="487" font-size="14">Высота; ускорения XYZ; скорости XYZ (оценка); угловые скорости XYZ.</text><text x="65" y="520" font-size="15" font-weight="bold">GPS / радио / энергонезависимая память</text><text x="65" y="542" font-size="14">Горизонтальное удаление; передача и хранение данных — проектные функции.</text><text x="65" y="575" font-size="15" font-weight="bold">Отдельный регистратор событий спасения</text><text x="65" y="597" font-size="14">Старт → апогей → команда спасения → приземление. Исполнительные цепи не моделируются.</text><text x="65" y="630" font-size="15" font-weight="bold">Самописец организаторов</text><text x="65" y="652" font-size="14">84 × 30 × 18 мм ±1 мм; ложемент и сменные прокладки; 8 вент-отверстий Ø2 мм.</text><text x="65" y="685" font-size="15" font-weight="bold">Собственное спасение МГМ</text><text x="65" y="707" font-size="14">Укладка внутри 220 мм; показан отдельный демонстрационный купол.</text><text x="65" y="740" font-size="15" font-weight="bold">Параметры, требующие дальнейшей проверки</text><text x="65" y="762" font-size="14">Высота, масса ракеты, устойчивость, спуск 5–10 м/с, прочность, питание 3 часа, интерфейс ПУ.</text></g></svg>