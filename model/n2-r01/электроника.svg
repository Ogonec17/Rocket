<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820"><rect width="1400" height="820" fill="#f3f6ef"/><g font-family="DejaVu Sans,sans-serif" fill="#203b43"><text x="50" y="60" font-size="30">Н2 / АРХИТЕКТУРА ЭЛЕКТРОНИКИ</text><text x="50" y="92" font-size="15">Функциональная схема · инертные макеты без конкретных моделей изделий</text><rect x="50" y="135" width="360" height="125" rx="8" fill="#dbe7e0" stroke="#668188"/><text x="68" y="165" font-size="17" font-weight="bold">Инерциальный модуль</text><text x="68" y="193" font-size="14">Ускорения XYZ</text><text x="68" y="216" font-size="14">Угловые скорости XYZ</text><rect x="50" y="280" width="360" height="125" rx="8" fill="#dbe7e0" stroke="#668188"/><text x="68" y="310" font-size="17" font-weight="bold">Барометр / температура</text><text x="68" y="338" font-size="14">Высота; атмосферное давление</text><text x="68" y="361" font-size="14">Температура — дополнительный канал</text><rect x="50" y="425" width="360" height="125" rx="8" fill="#dbe7e0" stroke="#668188"/><text x="68" y="455" font-size="17" font-weight="bold">GPS-приёмник</text><text x="68" y="483" font-size="14">Горизонтальное удаление</text><text x="68" y="506" font-size="14">Обязательный канал для Старшего ГИРД</text><rect x="500" y="265" width="360" height="150" rx="8" fill="#dbe7e0" stroke="#668188"/><text x="518" y="295" font-size="17" font-weight="bold">Центральный вычислитель</text><text x="518" y="323" font-size="14">Сбор измерений и временные метки</text><text x="518" y="346" font-size="14">Оценка скоростей XYZ</text><text x="518" y="369" font-size="14">Состояния миссии</text><rect x="950" y="170" width="380" height="120" rx="8" fill="#dbe7e0" stroke="#668188"/><text x="968" y="200" font-size="17" font-weight="bold">Энергонезависимая память</text><text x="968" y="228" font-size="14">Запись измерений и событий</text><text x="968" y="251" font-size="14">Хранение данных на борту</text><rect x="950" y="330" width="380" height="120" rx="8" fill="#dbe7e0" stroke="#668188"/><text x="968" y="360" font-size="17" font-weight="bold">Радиопередатчик + антенна</text><text x="968" y="388" font-size="14">Передача телеметрии</text><text x="968" y="411" font-size="14">Параметры аппаратуры не выбраны</text><path d="M410,197 L500,340 l-10,-5 m10,5 l-10,5" fill="none" stroke="#486d77" stroke-width="2"/><path d="M410,342 L500,340 l-10,-5 m10,5 l-10,5" fill="none" stroke="#486d77" stroke-width="2"/><path d="M410,487 L500,340 l-10,-5 m10,5 l-10,5" fill="none" stroke="#486d77" stroke-width="2"/><path d="M860,340 L950,230 l-10,-5 m10,5 l-10,5" fill="none" stroke="#486d77" stroke-width="2"/><path d="M860,340 L950,390 l-10,-5 m10,5 l-10,5" fill="none" stroke="#486d77" stroke-width="2"/><rect x="500" y="480" width="360" height="100" rx="8" fill="#dbe7e0" stroke="#668188"/><text x="518" y="510" font-size="17" font-weight="bold">Источник питания</text><text x="518" y="538" font-size="14">Батарея и интерфейсные платы</text><rect x="50" y="620" width="1280" height="140" rx="8" fill="#dbe7e0" stroke="#668188"/><text x="68" y="650" font-size="17" font-weight="bold">Отдельная регистрация событий спасения</text><text x="68" y="678" font-size="14">Старт → апогей → команда спасения → отделение МГМ → приземление</text><text x="68" y="701" font-size="14">Независимое посадочное место самописца организаторов. Исполнительные цепи не разрабатываются.</text><text x="68" y="724" font-size="14">Давление, температура и угловые скорости не обозначены обязательными без основания в ТЗ.</text></g></svg>