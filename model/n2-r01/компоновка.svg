<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820"><rect width="1400" height="820" fill="#f3f6ef"/><g font-family="DejaVu Sans,sans-serif" fill="#203b43"><text x="50" y="60" font-size="30">Н2 / КОМПОНОВКА И ПОЛЕЗНАЯ НАГРУЗКА</text><text x="50" y="92" font-size="15">Миллиметры · Z от хвостового торца · номинальная цифровая геометрия</text><path d="M70 200 H1090 L1290 242 L1090 284 H70 Z" fill="#d6e0df" stroke="#486d77" stroke-width="2"/><rect x="84" y="211" width="220" height="62" fill="#8998a8"/><text x="194.0" y="322" text-anchor="middle" font-size="15">Двигатель</text><rect x="355" y="211" width="216" height="62" fill="#80aaa0"/><text x="463.0" y="322" text-anchor="middle" font-size="15">Кассета</text><rect x="610" y="211" width="145" height="62" fill="#dfb46c"/><text x="682.5" y="322" text-anchor="middle" font-size="15">Укладка</text><rect x="845" y="211" width="220" height="62" fill="#d9a354"/><text x="955.0" y="322" text-anchor="middle" font-size="15">МГМ</text><path d="M70 180 V195" stroke="#486d77"/><text x="70" y="164" text-anchor="middle" font-size="15">Z0</text><path d="M330 180 V195" stroke="#486d77"/><text x="330" y="164" text-anchor="middle" font-size="15">Z260</text><path d="M580 180 V195" stroke="#486d77"/><text x="580" y="164" text-anchor="middle" font-size="15">Z510</text><path d="M800 180 V195" stroke="#486d77"/><text x="800" y="164" text-anchor="middle" font-size="15">Z730</text><path d="M1090 180 V195" stroke="#486d77"/><text x="1090" y="164" text-anchor="middle" font-size="15">Z1020</text><path d="M1290 180 V195" stroke="#486d77"/><text x="1290" y="164" text-anchor="middle" font-size="15">Z1220</text><rect x="70" y="370" width="580" height="160" rx="8" fill="#dbe7e0" stroke="#668188"/><text x="88" y="400" font-size="17" font-weight="bold">МГМ в установленном положении</text><text x="88" y="428" font-size="14">Ø66 × 220 мм · общая заданная масса 350 г</text><text x="88" y="451" font-size="14">Нижняя опора Z771–775; боковые направляющие</text><text x="88" y="474" font-size="14">Верхнее направляющее кольцо Z998–1001</text><text x="88" y="497" font-size="14">Собственная укладка спасения внутри габарита</text><rect x="710" y="370" width="580" height="160" rx="8" fill="#dbe7e0" stroke="#668188"/><text x="728" y="400" font-size="17" font-weight="bold">МГМ в извлечённом положении</text><text x="728" y="428" font-size="14">Отдельный режим просмотра «МГМ извлечён»</text><text x="728" y="451" font-size="14">Оболочка, две крышки и инертные внутренние макеты</text><text x="728" y="474" font-size="14">Сумма масс отдельных макетов не определена</text><text x="728" y="497" font-size="14">Реальная аппаратура и балласт не выбраны</text><rect x="70" y="570" width="1220" height="170" rx="8" fill="#dbe7e0" stroke="#668188"/><text x="88" y="600" font-size="17" font-weight="bold">Доступ и интерфейсы</text><text x="88" y="628" font-size="14">Передний люк: электронные платы. Задний люк: питание. Кассета на двух монтажных панелях.</text><text x="88" y="651" font-size="14">Самописец: отдельный ложемент и удерживающие перемычки, вентиляция 8 × Ø2 мм.</text><text x="88" y="674" font-size="14">МГМ устанавливается в отдельные опоры, не является несущей частью корпуса.</text><text x="88" y="697" font-size="14">Посадочные места номинальные: допуски изготовления, крепёж и прочность требуют отдельной проработки.</text></g></svg>