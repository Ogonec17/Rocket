<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="600" viewBox="0 0 1400 600"><rect width="1400" height="600" fill="#f1f5ef"/><g font-family="DejaVu Sans,sans-serif" fill="#243c45"><text x="50" y="60" font-size="30">Н2 / R02 / КОМПОНОВКА</text><text x="50" y="92" font-size="16">Длина 1220 мм · наружный диаметр 80 мм · проектные размеры</text><rect x="88.77049180327869" y="160" width="216.39344262295083" height="80" fill="#8898a3"/><text x="196.9672131147541" y="275" font-size="14" text-anchor="middle">Двигатель · только габарит</text><rect x="355.327868852459" y="160" width="212.45901639344262" height="80" fill="#709f96"/><text x="461.55737704918033" y="275" font-size="14" text-anchor="middle">Электроника</text><rect x="606.1475409836065" y="160" width="142.62295081967213" height="80" fill="#dab06b"/><text x="677.4590163934425" y="275" font-size="14" text-anchor="middle">Спасение</text><rect x="837.2950819672132" y="160" width="216.39344262295083" height="80" fill="#cf9b4f"/><text x="945.4918032786886" y="275" font-size="14" text-anchor="middle">МГМ Ø66 × 220</text><path d="M75 150 H1078.27868852459 L1275 200 L1078.27868852459 250 H75 Z" stroke="#496b75" fill="none" stroke-width="2"/><text x="50" y="350" font-size="17">Окна облегчения имеют округлённые углы; места под стойки сохранены.</text><text x="50" y="400" font-size="17">Крепёж представлен отдельными телами; головки размещены в посадочных гнёздах.</text><text x="50" y="450" font-size="17">Разъёмы с отдельными контактами — габаритные макеты без конкретного производителя.</text><text x="50" y="500" font-size="17">Материалы, технологические допуски, силовые соединения и работоспособность требуют испытаний.</text></g></svg>