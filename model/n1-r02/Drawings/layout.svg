<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="600" viewBox="0 0 1400 600"><rect width="1400" height="600" fill="#f1f5ef"/><g font-family="DejaVu Sans,sans-serif" fill="#243c45"><text x="50" y="60" font-size="30">Н1 / R02 / КОМПОНОВКА</text><text x="50" y="92" font-size="16">Длина 1050 мм · наружный диаметр 72 мм · проектные размеры</text><rect x="84.14285714285714" y="160" width="182.85714285714283" height="80" fill="#8898a3"/><text x="175.57142857142856" y="275" font-size="14" text-anchor="middle">Двигатель · только габарит</text><rect x="339.0" y="160" width="230.85714285714283" height="80" fill="#709f96"/><text x="454.42857142857144" y="275" font-size="14" text-anchor="middle">Электроника</text><rect x="606.4285714285714" y="160" width="131.42857142857142" height="80" fill="#dab06b"/><text x="672.1428571428571" y="275" font-size="14" text-anchor="middle">Спасение</text><rect x="777.8571428571428" y="160" width="251.42857142857142" height="80" fill="#cf9b4f"/><text x="903.5714285714284" y="275" font-size="14" text-anchor="middle">МГМ Ø66 × 220</text><path d="M75 150 H1080.7142857142858 L1275 200 L1080.7142857142858 250 H75 Z" stroke="#496b75" fill="none" stroke-width="2"/><text x="50" y="350" font-size="17">Окна облегчения имеют округлённые углы; места под стойки сохранены.</text><text x="50" y="400" font-size="17">Крепёж представлен отдельными телами; головки размещены в посадочных гнёздах.</text><text x="50" y="450" font-size="17">Разъёмы с отдельными контактами — габаритные макеты без конкретного производителя.</text><text x="50" y="500" font-size="17">Материалы, технологические допуски, силовые соединения и работоспособность требуют испытаний.</text></g></svg>