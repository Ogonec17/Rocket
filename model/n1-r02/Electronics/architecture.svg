<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#557b84"/></marker></defs><rect width="1600" height="1040" fill="#f1f5ef"/><g font-family="DejaVu Sans,sans-serif" fill="#263f48"><text x="50" y="65" font-size="32">Н1 / ФУНКЦИОНАЛЬНАЯ АРХИТЕКТУРА ЭЛЕКТРОНИКИ</text><text x="50" y="100" font-size="18">ASSUMED — связи блоков; изделия, распиновки и электрические параметры — TBD</text><rect x="50" y="160" width="340" height="90" rx="8" fill="#e0e9e5" stroke="#73918f"/><text x="65" y="194" font-size="19">Инерциальные измерения</text><text x="65" y="224" font-size="14">Ускорения XYZ; угловые скорости XYZ</text><rect x="50" y="290" width="340" height="90" rx="8" fill="#e0e9e5" stroke="#73918f"/><text x="65" y="324" font-size="19">Атмосферные измерения</text><text x="65" y="354" font-size="14">Давление / высота; температура — не выбрана</text><rect x="50" y="420" width="340" height="90" rx="8" fill="#e0e9e5" stroke="#73918f"/><text x="65" y="454" font-size="19">Навигационный модуль</text><text x="65" y="484" font-size="14">Горизонтальное удаление от старта</text><rect x="570" y="160" width="370" height="100" rx="8" fill="#e0e9e5" stroke="#73918f"/><text x="585" y="194" font-size="19">Центральный вычислитель</text><text x="585" y="224" font-size="14">Сбор измерений и временные метки</text><rect x="570" y="310" width="370" height="100" rx="8" fill="#e0e9e5" stroke="#73918f"/><text x="585" y="344" font-size="19">Обработка измерений</text><text x="585" y="374" font-size="14">В том числе оценка скоростей XYZ</text><rect x="570" y="460" width="370" height="100" rx="8" fill="#e0e9e5" stroke="#73918f"/><text x="585" y="494" font-size="19">Энергонезависимая запись</text><text x="585" y="524" font-size="14">Формат данных и реализация TBD</text><rect x="1120" y="160" width="420" height="100" rx="8" fill="#e0e9e5" stroke="#73918f"/><text x="1135" y="194" font-size="19">Радиомодуль и антенна</text><text x="1135" y="224" font-size="14">Фактические настройки TBD</text><rect x="1120" y="340" width="420" height="100" rx="8" fill="#e0e9e5" stroke="#73918f"/><text x="1135" y="374" font-size="19">Наземный приём и интерфейс</text><text x="1135" y="404" font-size="14">Получение, отображение, сохранение</text><rect x="50" y="650" width="340" height="100" rx="8" fill="#e0e9e5" stroke="#73918f"/><text x="65" y="684" font-size="19">Питание и контроль состояния</text><text x="65" y="714" font-size="14">Источник и ёмкость TBD</text><rect x="570" y="650" width="370" height="100" rx="8" fill="#e0e9e5" stroke="#73918f"/><text x="585" y="684" font-size="19">Распределение питания</text><text x="585" y="714" font-size="14">Функциональные потребители</text><rect x="1120" y="650" width="420" height="100" rx="8" fill="#e0e9e5" stroke="#73918f"/><text x="1135" y="684" font-size="19">Отдельная регистрация событий</text><text x="1135" y="714" font-size="14">Старт / апогей / спасение / посадка</text><path d="M390 205 H570" fill="none" stroke="#557b84" stroke-width="2" marker-end="url(#arrow)"/><path d="M390 335 H480 V210 H570" fill="none" stroke="#557b84" stroke-width="2" marker-end="url(#arrow)"/><path d="M390 465 H460 V220 H570" fill="none" stroke="#557b84" stroke-width="2" marker-end="url(#arrow)"/><path d="M755 260 V310" fill="none" stroke="#557b84" stroke-width="2" marker-end="url(#arrow)"/><path d="M755 410 V460" fill="none" stroke="#557b84" stroke-width="2" marker-end="url(#arrow)"/><path d="M940 210 H1120" fill="none" stroke="#557b84" stroke-width="2" marker-end="url(#arrow)"/><path d="M1330 260 V340" fill="none" stroke="#557b84" stroke-width="2" marker-end="url(#arrow)"/><path d="M390 700 H570" fill="none" stroke="#557b84" stroke-width="2" marker-end="url(#arrow)"/><path d="M940 700 H1120" fill="none" stroke="#557b84" stroke-width="2" marker-end="url(#arrow)"/><text x="50" y="835" font-size="17">VERIFIED — только подтверждённое требование регламента; работоспособность и точность пока TBD.</text><text x="50" y="878" font-size="17">Угловые скорости не заменяют требуемые регламентом скорости полёта по трём осям.</text><text x="50" y="921" font-size="17">Отделение МГМ: не является обязательным событием базового задания. Следующая ступень: NOT_APPLICABLE.</text><text x="50" y="964" font-size="17">Парашюты и события показаны визуально; исполнительные механизмы и алгоритмы инициирования не проектируются.</text></g></svg>