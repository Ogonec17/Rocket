<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="690" viewBox="0 0 1600 690"><rect width="1600" height="690" fill="#f1f5ef"/><g font-family="DejaVu Sans,sans-serif" fill="#263f48"><text x="50" y="60" font-size="32">Н3 / СХЕМАТИЧЕСКАЯ КОМПОНОВКА / ASSUMED</text><text x="50" y="95" font-size="18">Длина 1840 мм · корпус Ø108 мм · пять функциональных секций</text><rect x="70.0" y="170" width="396.73913043478257" height="85" fill="#8c9ba5"/><path d="M268.36956521739125 260 V310" stroke="#567e87"/><text x="268.36956521739125" y="335" text-anchor="middle" font-size="16">Двигательный отсек</text><rect x="466.73913043478257" y="170" width="253.91304347826087" height="85" fill="#719c91"/><path d="M593.695652173913 260 V365" stroke="#567e87"/><text x="593.695652173913" y="390" text-anchor="middle" font-size="16">Вычисление и питание</text><rect x="720.6521739130435" y="170" width="142.82608695652172" height="85" fill="#6da3ae"/><path d="M792.0652173913044 260 V310" stroke="#567e87"/><text x="792.0652173913044" y="335" text-anchor="middle" font-size="16">Измерения</text><rect x="863.4782608695651" y="170" width="206.30434782608694" height="85" fill="#d5aa65"/><path d="M966.6304347826086 260 V365" stroke="#567e87"/><text x="966.6304347826086" y="390" text-anchor="middle" font-size="16">Спасение</text><rect x="1069.782608695652" y="170" width="238.04347826086956" height="85" fill="#d09c50"/><path d="M1188.8043478260868 260 V310" stroke="#567e87"/><text x="1188.8043478260868" y="335" text-anchor="middle" font-size="16">МГМ ВЛ</text><path d="M1308 170 Q1480 172 1530 212 Q1480 253 1308 255 Z" fill="#c7d5d2"/><text x="1420" y="335" text-anchor="middle" font-size="16">Обтекатель</text><text x="50" y="465" font-size="18">МГМ: Ø84 × 220 мм, 1500 г — VERIFIED как габарит и масса всей подсборки.</text><text x="50" y="511" font-size="18">Вычислительный блок: четыре поперечных яруса на отдельных продольных опорах.</text><text x="50" y="557" font-size="18">Измерительный отсек: датчики, GPS и отдельный ложемент самописца организаторов.</text><text x="50" y="603" font-size="18">Габариты двигателя, материалы, технологические допуски и прочность требуют уточнения.</text></g></svg>